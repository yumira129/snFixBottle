name: Build FixBottle JAR
on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - run: mvn -B package --file pom.xml
      - uses: actions/upload-artifact@v4
        with:
          name: FixBottle-jar
          path: target/*.jar
          if-no-files-found: error
